<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SIMO — Bengaluru traffic lab</title>
<style>
  /* pre-paint shell only; full theme arrives via BALAGERE_CSS_STYLE (public/data.js),
     which src/main.js injects into a <style> tag at bootstrap */
  html,body{margin:0;height:100%;background:#0B0B0C;color:#F5F5F7;
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  #root{height:100%;display:flex;flex-direction:column}
</style>
</head>
<body>
<div id="root"></div>
<!-- generated data bundle: BALAGERE_CSS_STYLE, LANES_PALETTE, BALAGERE_GEOMETRY,
     OTHER_SIMS, CATALOG (served from public/). Classic scripts block while
     module scripts are deferred, so this is guaranteed to run first. -->
<script src="/data.js"></script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
